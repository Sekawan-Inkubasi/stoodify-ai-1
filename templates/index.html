<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stoodify Engine - Halaman Uji</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --ink:#1d2433; --mute:#6b7487; --line:#e3e6ee;
          --brand:#4f46e5; --high:#dc2626; --med:#d97706; --low:#16a34a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:18px 24px; background:var(--brand); color:#fff; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; opacity:.85; font-size:13px; }
  main { max-width:1100px; margin:0 auto; padding:20px; display:grid; gap:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  h2 { margin:0 0 10px; font-size:16px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:end; }
  label { font-size:12px; color:var(--mute); display:flex; flex-direction:column; gap:4px; }
  input[type=number] { width:80px; padding:6px; border:1px solid var(--line); border-radius:6px; }
  button { padding:9px 16px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { background:#b9bccb; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mute); font-weight:600; font-size:12px; }
  .badge { padding:2px 8px; border-radius:99px; color:#fff; font-size:11px; font-weight:600; }
  .high { background:var(--high); } .medium { background:var(--med); } .low { background:var(--low); }
  .bar { height:8px; border-radius:4px; background:#eceefe; min-width:80px; }
  .bar i { display:block; height:100%; border-radius:4px; background:var(--brand); }
  .warn { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; padding:8px 12px; border-radius:8px; font-size:13px; margin-bottom:6px; }
  .day { margin-bottom:12px; }
  .day h3 { margin:0 0 6px; font-size:13px; color:var(--brand); }
  .sess { display:grid; grid-template-columns:110px 1fr; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; font-size:13px; }
  .sess small { color:var(--mute); display:block; margin-top:2px; }
  .mute { color:var(--mute); font-size:12px; }
  .chips span { display:inline-block; background:#eef0f7; border-radius:6px; padding:3px 8px; margin:2px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Stoodify Engine - Halaman Uji</h1>
  <p id="meta">Memuat data...</p>
</header>
<main>
  <section>
    <h2>Bobot Rumus (bisa diubah, lalu Generate ulang)</h2>
    <div class="row" id="weights"></div>
    <div class="row" style="margin-top:12px">
      <button id="gen">Generate Jadwal (Fallback)</button>
      <button id="genAi">Pakai AI (Gemini)</button>
      <span id="status" class="mute"></span>
    </div>
  </section>

  <section id="warnSec" style="display:none"><h2>Peringatan</h2><div id="warns"></div></section>

  <section>
    <h2>1. Skor Prioritas</h2>
    <div class="mute" style="margin-bottom:8px">Skor 0-100. Kolom komponen bernilai 0-1 sebelum dikalikan bobot.</div>
    <div style="overflow-x:auto"><table id="scores"></table></div>
  </section>

  <section>
    <h2>2. Slot Kosong</h2>
    <div class="chips" id="slots"></div>
  </section>

  <section>
    <h2>3. Jadwal Sesi Belajar</h2>
    <div id="sessions"></div>
  </section>

  <section>
    <h2>Data Siswa (buatan)</h2>
    <div id="raw" class="mute"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const DAY_ID = {mon:"Senin",tue:"Selasa",wed:"Rabu",thu:"Kamis",fri:"Jumat",sat:"Sabtu",sun:"Minggu"};
let weights = {};

async function load() {
  const d = await (await fetch("/api/data")).json();
  weights = d.weights;
  $("meta").textContent = `Siswa: ${d.student.name} | "Sekarang" tetap: ${d.now} | Jam belajar ${d.student.preferences.start_time}-${d.student.preferences.end_time}, sesi ${d.student.preferences.session_duration} menit`;
  $("weights").innerHTML = Object.entries(weights).map(([k,v]) =>
    `<label>${k}<input type="number" step="0.05" min="0" max="1" data-k="${k}" value="${v}"></label>`).join("");
  const t = d.student.tasks;
  $("raw").innerHTML = `${t.length} tugas, ${d.student.schedules.length} jadwal sekolah, ${d.student.activities.length} kegiatan rutin. Edit di <code>data.py</code>, lalu refresh halaman.`;
  run("fallback");
}

function formatDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("id-ID", {weekday:"long", day:"numeric", month:"short"});
}

async function run(mode = "fallback") {
  const w = {};
  document.querySelectorAll("#weights input").forEach(i => w[i.dataset.k] = parseFloat(i.value));
  const r = await (await fetch("/api/run", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({weights:w, mode})})).json();

  const secs = (r.latency_ms / 1000).toFixed(1);
  $("status").innerHTML = r.source === "gemini"
    ? `<b style="color:var(--low)">Sumber: Gemini</b> (${r.model}, ${secs} dtk)`
    : `<b>Sumber: Fallback</b> (${secs} dtk)` + (r.fallback_reason ? ` - <span style="color:var(--high)">${r.fallback_reason}</span>` : "");
  const notes = [...r.warnings, ...(r.dropped || []).map(x => "Ditolak validasi: " + x)];
  $("warnSec").style.display = notes.length ? "block" : "none";
  $("warns").innerHTML = notes.map(x => `<div class="warn">${x}</div>`).join("");

  $("scores").innerHTML = `<tr><th>#</th><th>Tugas</th><th>Deadline</th><th>Sisa hari</th><th>Progres</th>
    <th>Deadline</th><th>Sulit</th><th>Durasi</th><th>Jenis</th><th>Late</th><th>Skor</th></tr>` +
    r.scores.map((s,i) => `<tr><td>${i+1}</td><td><b>${s.title}</b><br><span class="mute">${s.subject} - ${s.type}</span></td>
      <td>${s.deadline}</td><td>${s.days_left}</td><td>${s.progress}%</td>
      <td>${s.parts.deadline}</td><td>${s.parts.difficulty}</td><td>${s.parts.duration}</td><td>${s.parts.importance}</td><td>${s.parts.late_risk}</td>
      <td><span class="badge ${s.priority}">${s.score}</span><div class="bar"><i style="width:${s.score}%"></i></div></td></tr>`).join("");

  $("slots").innerHTML = r.slots.map(s => `<span>${formatDate(s.date)} ${s.start}-${s.end}</span>`).join("") || "Tidak ada slot kosong.";

  const byDate = {};
  r.sessions.forEach(s => (byDate[s.date] ||= []).push(s));
  $("sessions").innerHTML = Object.keys(byDate).map(date =>
    `<div class="day"><h3>${formatDate(date)}</h3>` + byDate[date].map(s =>
      `<div class="sess"><div><b>${s.start_time}-${s.end_time}</b><small>${s.duration} menit</small></div>
       <div><span class="badge ${s.priority}">${s.priority}</span> <b>${s.title}</b> <span class="mute">target progres ${s.target_progress}%</span>
       <small>${s.reason}</small></div></div>`).join("") + `</div>`).join("") || "Belum ada sesi.";
}

$("gen").onclick = () => run("fallback");
$("genAi").onclick = async () => { $("genAi").disabled = true; $("status").textContent = "Menunggu Gemini..."; await run("ai"); $("genAi").disabled = false; };
load();
</script>
</body>
</html>
